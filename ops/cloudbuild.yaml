# ===========================================
# A2R RAG API - Cloud Build Configuration
# Updated for us-east4 region and proper secrets
# ===========================================

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:$SHORT_SHA'
      - '-t'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:latest'
      - '-f'
      - 'ops/Dockerfile'
      - '.'
    
  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - '--all-tags'
      - 'us-east4-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rag-api'
      - '--image=us-east4-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:$SHORT_SHA'
      - '--region=us-east4'
      - '--service-account=rag-api-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=rag-connector'
      - '--vpc-egress=all-traffic'
      - '--min-instances=1'
      - '--max-instances=20'
      - '--cpu=2'
      - '--memory=4Gi'
      - '--timeout=300'
      - '--concurrency=80'
      - '--set-secrets=MONGO_URI=MONGO_URI:latest'
      - '--set-secrets=LANGCHAIN_API_KEY=LANGSMITH_API_KEY:latest'
      - '--set-env-vars=MONGO_DB=rag_db,MONGO_COLLECTION=documents,VECTOR_INDEX=rag-chatbot-index'
      - '--set-env-vars=EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2'
      - '--set-env-vars=OLLAMA_BASE_URL=http://localhost:11434,OLLAMA_MODEL=mistral'
      - '--set-env-vars=LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=A2R-RAG'
      - '--set-env-vars=LOG_LEVEL=INFO,API_VERSION=1.0.0,ENVIRONMENT=production'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--allow-unauthenticated'
      - '--port=8080'

# Store images in Artifact Registry
images:
  - 'us-east4-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:$SHORT_SHA'
  - 'us-east4-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '50'
  logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: '1200s'