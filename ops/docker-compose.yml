version: '3.8'

services:
  # Ollama Service - Private LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - rag_network
    # No ports exposed to host - only accessible within Docker network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # FastAPI Application
  fastapi:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    container_name: rag-api
    environment:
      # MongoDB Atlas
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB=rag_db
      - MONGO_COLLECTION=documents
      - VECTOR_INDEX=rag-chatbot-index
      
      # Embeddings
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      
      # Ollama - Internal Docker network
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=mistral
      
      # LangSmith
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=A2R-RAG
      
      # Application
      - LOG_LEVEL=INFO
      - API_VERSION=1.0.0
      - ENVIRONMENT=production
      - PORT=8080
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_network
    # Only expose to nginx, not to host
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - rag_network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local